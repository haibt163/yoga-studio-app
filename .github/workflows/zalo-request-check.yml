name: Temporary Zalo request verification

on:
  push:
    branches:
      - fix/mobile-zalo-request-panel

permissions:
  contents: read

jobs:
  lint-build-mobile:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_CONTACT_LINK: "https://zalo.me/123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install temporary browser test tooling
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/yoga-next.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/vi/booking > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/yoga-next.log
          exit 1
      - name: Emulate iPhone and Android layouts
        run: |
          cat > mobile-layout-check.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const devices = [
            { name: 'iPhone-sized', width: 390, height: 844, scale: 3 },
            { name: 'Android-sized', width: 360, height: 800, scale: 2.75 },
          ];

          try {
            for (const device of devices) {
              const context = await browser.newContext({
                viewport: { width: device.width, height: device.height },
                screen: { width: device.width, height: device.height },
                deviceScaleFactor: device.scale,
                isMobile: true,
                hasTouch: true,
              });
              const page = await context.newPage();
              const openedPages = [];
              context.on('page', (newPage) => openedPages.push(newPage));

              await page.goto('http://127.0.0.1:3000/vi/booking', { waitUntil: 'networkidle' });
              await page.locator('#request-name').fill('Nguyen Thi Mai');
              await page.locator('#request-phone').fill('0901234567');
              await page.locator('#request-time').fill('Sáng thứ Ba');
              await page.getByRole('button', { name: 'Gửi yêu cầu' }).click();
              await page.locator('#zalo-request-title').waitFor();
              await page.waitForTimeout(800);

              const metrics = await page.evaluate(() => {
                const inputIds = ['guest-id', 'guest-pin', 'request-name', 'request-phone', 'request-time'];
                const inputs = inputIds.map((id) => {
                  const element = document.getElementById(id);
                  return element ? Number.parseFloat(getComputedStyle(element).fontSize) : 0;
                });
                const copy = [...document.querySelectorAll('button')].find((element) => element.textContent?.includes('Sao chép tin nhắn'));
                const open = [...document.querySelectorAll('a')].find((element) => element.textContent?.includes('Mở Zalo'));
                const textarea = document.querySelector('textarea[readonly]');
                const panel = document.getElementById('zalo-request-title')?.parentElement;
                return {
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  inputFontSizes: inputs,
                  copyButtonHeight: copy?.getBoundingClientRect().height ?? 0,
                  openLinkHeight: open?.getBoundingClientRect().height ?? 0,
                  textareaWidth: textarea?.getBoundingClientRect().width ?? 0,
                  panelWidth: panel?.getBoundingClientRect().width ?? 0,
                  manualFallbackVisible: document.body.innerText.includes('nhấn giữ tin nhắn ở trên'),
                  instructionVisible: document.body.innerText.includes('Mở Zalo, dán nội dung và nhấn Gửi'),
                  openLinkTarget: open?.getAttribute('target') ?? null,
                  openLinkRel: open?.getAttribute('rel') ?? null,
                  activeElement: document.activeElement?.tagName ?? null,
                };
              });

              const failures = [];
              if (metrics.documentWidth > device.width) failures.push('horizontal overflow');
              if (metrics.inputFontSizes.length !== 5 || metrics.inputFontSizes.some((size) => size < 16)) failures.push('input font below 16px');
              if (metrics.copyButtonHeight < 44) failures.push('copy button below 44px');
              if (metrics.openLinkHeight < 44) failures.push('open link below 44px');
              if (!metrics.manualFallbackVisible) failures.push('manual copy fallback not visible');
              if (!metrics.instructionVisible) failures.push('two-step instruction not visible');
              if (metrics.openLinkTarget !== '_blank' || !metrics.openLinkRel?.includes('noopener')) failures.push('open link target/rel incorrect');
              if (openedPages.length !== 0) failures.push('Zalo opened during form submission');

              console.log(JSON.stringify({ device: device.name, ...metrics, result: failures.length ? 'FAIL' : 'PASS', failures }));
              await context.close();
              if (failures.length) throw new Error(`${device.name}: ${failures.join(', ')}`);
            }
          } finally {
            await browser.close();
          }
          EOF
          node mobile-layout-check.mjs
